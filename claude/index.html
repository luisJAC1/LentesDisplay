<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=2,shrink-to-fit=no">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="description" content="Claude en los lentes de Alfaro">
<title>Claude</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  main {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 20px;
    box-sizing: border-box;
  }
  h1 { margin: 0; font-size: 26px; color: #f96; text-align: center; }
  /* Caja donde sale la respuesta de Claude */
  #respuesta {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    font-size: 24px;
    line-height: 1.3;
    color: #fff;
    border: 2px solid #333;
    border-radius: 16px;
    padding: 14px;
  }
  /* Renglones de una sola línea. Si no caben, se cortan con "..." */
  #pregunta, #fuentes {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #pregunta { font-size: 18px; color: #aaa; min-height: 22px; }
  #fuentes { font-size: 14px; color: #8ad; min-height: 18px; }
  #estado { font-size: 16px; color: #f9a; text-align: center; min-height: 20px; }
  .fila { display: flex; gap: 8px; }
  input, button {
    font-size: 20px;
    padding: 10px 6px;
    border-radius: 14px;
    border: 2px solid #555;
    background: #111;
    color: #fff;
  }
  input { width: 100%; box-sizing: border-box; padding: 10px 14px; font-size: 22px; }
  button { flex: 1; white-space: nowrap; }
  input:focus, button:focus { outline: 4px solid #f96; border-color: #f96; }
</style>
</head>
<body>
<main>
  <h1>✳️ Claude</h1>
  <div id="pregunta"></div>
  <div id="respuesta">Toca el campo de abajo y pregúntame algo.</div>
  <div id="fuentes"></div>
  <input id="campo" type="text" placeholder="Pregúntale a Claude">
  <div class="fila">
    <button id="nueva">🧹 Nueva</button>
    <button id="voz">🔇 Voz</button>
    <button id="oir">▶️ Oír</button>
    <button id="gps">✖️ GPS</button>
  </div>
  <div id="estado"></div>
</main>

<script>
  // La URL de tu Worker de Cloudflare
  const WORKER_URL = 'https://claude-lentes.jacs-lab.workers.dev';

  const campo = document.getElementById('campo');
  const respuesta = document.getElementById('respuesta');
  const pregunta = document.getElementById('pregunta');
  const fuentes = document.getElementById('fuentes');
  const estado = document.getElementById('estado');
  const btnNueva = document.getElementById('nueva');
  const btnVoz = document.getElementById('voz');
  const btnOir = document.getElementById('oir');
  const btnGps = document.getElementById('gps');

  // Pequeña ayuda para leer y guardar en la "libretita" del navegador sin que truene
  function leer(clave) { try { return localStorage.getItem(clave); } catch (e) { return null; } }
  function guardar(clave, valor) { try { localStorage.setItem(clave, valor); } catch (e) {} }

  // Pone un texto en la caja de respuesta. Si no cabe, achica la letra hasta que quepa
  function mostrar(texto) {
    respuesta.textContent = texto;
    let letra = 24;
    respuesta.style.fontSize = letra + 'px';
    while (respuesta.scrollHeight > respuesta.clientHeight && letra > 15) {
      letra--;
      respuesta.style.fontSize = letra + 'px';
    }
  }

  // 1. PIN. La primera vez te lo pide y lo guarda en los lentes (nunca en GitHub)
  let pin = leer('pin');
  function revisarPin() {
    if (!pin) {
      campo.placeholder = 'Escribe tu PIN (solo la primera vez)';
      estado.textContent = 'Falta tu PIN 🔒';
    } else {
      campo.placeholder = 'Pregúntale a Claude';
      estado.textContent = 'Listo ✅';
    }
  }
  revisarPin();

  // 2. VOZ EN ESPAÑOL. El Worker convierte la respuesta en audio y aquí lo reproducimos
  //    Truco para que no tarde: partimos la respuesta en frases, pedimos el audio de todas
  //    al mismo tiempo y empezamos a hablar en cuanto llega la primera.
  let vozOn = leer('vozOn') === '1';
  let ultimoTexto = '';                          // el texto de la última respuesta
  let audios = { texto: '', promesas: [] };      // los audios ya pedidos, para repetir sin volver a pagar
  let audioActual = null;                        // el pedacito que está sonando
  let turnoVoz = 0;                              // sube cada vez que hay que callar lo anterior

  function pintarVoz() { btnVoz.textContent = vozOn ? '🔊 Voz' : '🔇 Voz'; }
  pintarVoz();
  btnVoz.addEventListener('click', function () {
    vozOn = !vozOn;
    guardar('vozOn', vozOn ? '1' : '0');
    pintarVoz();
    if (!vozOn) callar();
  });

  // Calla lo que esté sonando
  function callar() {
    turnoVoz++;
    if (audioActual) audioActual.pause();
    audioActual = null;
  }

  // Parte un texto en frases. Las muy cortitas se pegan con la siguiente para que no suene cortado
  function partir(texto) {
    const frases = texto.split(/(?<=[.!?…])\s+/);
    const partes = [];
    let junta = '';
    for (const f of frases) {
      junta = junta ? junta + ' ' + f : f;
      if (junta.length >= 25) { partes.push(junta); junta = ''; }
    }
    if (junta) {
      if (partes.length) partes[partes.length - 1] += ' ' + junta;
      else partes.push(junta);
    }
    return partes;
  }

  // Le pide al Worker el audio de un texto
  async function pedirAudio(texto) {
    const res = await fetch(WORKER_URL + '/voz', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Pin': pin },
      body: JSON.stringify({ text: texto }),
    });
    if (!res.ok) {
      let msg = 'Error de voz';
      try { msg = (await res.json()).error || msg; } catch (e) {}
      throw new Error(msg);
    }
    const blob = await res.blob();
    return new Audio(URL.createObjectURL(blob));
  }

  // Toca un pedacito de audio y avisa cuando termina
  function tocar(audio) {
    return new Promise(function (termino, fallo) {
      audio.onended = termino;
      audio.onerror = function () { fallo(new Error('No se pudo reproducir')); };
      audio.currentTime = 0;
      audio.play().then(function () { estado.textContent = 'Hablando... 🔊'; }).catch(fallo);
    });
  }

  // Dice un texto en voz alta, frase por frase
  async function decir(texto) {
    callar();
    const turno = turnoVoz;

    // Si es el mismo texto de antes y sus audios salieron bien, los reusamos
    if (audios.texto !== texto || audios.fallo) {
      audios = { texto: texto, fallo: false, promesas: partir(texto).map(pedirAudio) };
      audios.promesas.forEach(function (p) { p.catch(function () { audios.fallo = true; }); });
    }
    const mios = audios;

    estado.textContent = 'Preparando voz... 🎙️';
    try {
      for (const promesa of mios.promesas) {
        const audio = await promesa;          // la primera frase llega rápido, las demás ya vienen en camino
        if (turno !== turnoVoz) return;       // llegó otra respuesta o apagaste la voz
        audioActual = audio;
        await tocar(audio);
        if (turno !== turnoVoz) return;
      }
      estado.textContent = 'Listo ✅';
    } catch (e) {
      if (turno !== turnoVoz) return;
      estado.textContent = e.name === 'NotAllowedError' ? 'Toca ▶️ Oír para escucharlo' : 'Voz: ' + e.message;
    }
  }

  function hablar(texto) {
    ultimoTexto = texto;
    callar();
    if (vozOn) decir(texto);
  }

  // Botón Oír. Repite la última respuesta
  btnOir.addEventListener('click', function () {
    if (!ultimoTexto) { estado.textContent = 'Todavía no hay nada que oír'; return; }
    decir(ultimoTexto);
  });

  // 3. GPS. Solo se manda tu ubicación cuando este botón está prendido
  let gpsOn = leer('gpsOn') === '1';
  let ultimaUbicacion = null;   // la última que sí se pudo leer, por si una lectura falla

  function pintarGps() { btnGps.textContent = gpsOn ? '📍 GPS' : '✖️ GPS'; }
  pintarGps();

  // Le pide la ubicación al navegador (que la saca del GPS de tu cel).
  // Si tarda más de 5 segundos o falla, regresa la última conocida o nada.
  function leerUbicacion() {
    return new Promise(function (listo) {
      if (!('geolocation' in navigator)) return listo(null);
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          ultimaUbicacion = {
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            precision: pos.coords.accuracy,
          };
          listo(ultimaUbicacion);
        },
        function () { listo(ultimaUbicacion); },
        { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
      );
    });
  }

  btnGps.addEventListener('click', async function () {
    if (gpsOn) {
      gpsOn = false;
      ultimaUbicacion = null;
      estado.textContent = 'GPS apagado';
    } else {
      estado.textContent = 'Buscando tu ubicación... 📡';
      const u = await leerUbicacion();
      gpsOn = !!u;
      estado.textContent = u ? 'GPS prendido ✅' : 'No pude leer el GPS. Revisa el permiso de ubicación';
    }
    guardar('gpsOn', gpsOn ? '1' : '0');
    pintarGps();
  });

  // 4. MEMORIA DE LA PLÁTICA. Claude recuerda lo último que hablaron mientras la app está abierta.
  //    (La memoria permanente vive en el Worker, esa no se borra con este botón)
  let historial = [];
  btnNueva.addEventListener('click', function () {
    historial = [];
    pregunta.textContent = '';
    fuentes.textContent = '';
    mostrar('Plática nueva. Pregúntame algo.');
    estado.textContent = 'Borrón y cuenta nueva 🧹';
  });

  // 5. PREGUNTAR. Cuando terminas de dictar o escribir, se manda al Worker y el Worker a Claude
  campo.addEventListener('change', async function () {
    const texto = campo.value.trim();
    campo.value = '';
    if (!texto) return;

    // Si todavía no hay PIN, lo que escribiste es el PIN.
    // Le quitamos puntos, comas y espacios que a veces mete el dictado
    if (!pin) {
      pin = texto.replace(/[^a-z0-9]/gi, '').toLowerCase();
      if (!pin) {
        estado.textContent = 'Ese PIN quedó vacío, intenta otra vez';
        return;
      }
      guardar('pin', pin);
      revisarPin();
      mostrar('PIN guardado: ' + pin + ' ✅ Ya pregúntame algo.');
      return;
    }

    pregunta.textContent = '🗣️ ' + texto;
    fuentes.textContent = '';
    mostrar('Pensando... 🤔');
    estado.textContent = '';
    historial.push({ role: 'user', content: texto });

    try {
      const envio = { messages: historial.slice(-10) };
      if (gpsOn) {
        const u = await leerUbicacion();
        if (u) envio.ubicacion = u;
      }

      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Pin': pin },
        body: JSON.stringify(envio),
      });
      const data = await res.json();

      if (res.status === 401) {
        // PIN mal escrito. Lo borramos para que lo vuelvas a poner
        pin = null;
        guardar('pin', '');
        historial.pop();
        mostrar('PIN incorrecto. Vuelve a escribirlo abajo.');
        revisarPin();
        return;
      }
      if (!res.ok) throw new Error(data.error || 'Algo falló');

      historial.push({ role: 'assistant', content: data.text });
      mostrar(data.text);

      // Renglón chiquito con lo que usó Claude (🔎 buscó, 🌦️ clima, 📍 lugar, 💾 memoria) y sus fuentes
      const extras = (data.usado || []).join(' ');
      const sitios = (data.fuentes || []).join(', ');
      fuentes.textContent = [extras, sitios].filter(Boolean).join(' · ');
      estado.textContent = data.aviso || 'Listo ✅';

      hablar(data.text);
    } catch (err) {
      historial.pop();
      mostrar('No pude hablar con Claude 😵');
      estado.textContent = 'Error: ' + err.message;
    }
  });

  // 6. NAVEGACIÓN con el Neural Band
  const controles = [campo, btnNueva, btnVoz, btnOir, btnGps];
  document.addEventListener('keydown', function (e) {
    const adelante = e.key === 'ArrowDown' || e.key === 'ArrowRight';
    const atras = e.key === 'ArrowUp' || e.key === 'ArrowLeft';
    if (!adelante && !atras) return;
    e.preventDefault();
    let i = controles.indexOf(document.activeElement);
    i = i === -1 ? 0 : (i + (adelante ? 1 : -1) + controles.length) % controles.length;
    controles[i].focus();
  });

  campo.focus();
</script>
</body>
</html>
